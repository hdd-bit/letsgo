<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="ko">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탐험대 모둠 편성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef2f8;--surface:#fff;--ink:#14213d;--muted:#5a6a86;--line:#d3dcea;--brand:#2446d6;--brandSoft:#e5ebff;--brandInk:#fff;--a:#d93a21;--b:#2a62e8;--c:#0c8f7d;--d:#b87c00;--warn:#b45309;--warnBg:#fff8df;--warnLine:#dfc274;--okBg:#e4faf5;--okLine:#78c5b9;--danger:#c62828}
    *{box-sizing:border-box}
    html,body{background:var(--bg)}
    body{margin:0;color:var(--ink);font-family:"Noto Sans KR",sans-serif;word-break:keep-all}
    h1,h2,h3,h4{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;margin:0;line-height:1.25}
    p{margin:0}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
    [hidden]{display:none!important}

    .app-shell{width:100%;min-height:100vh;padding:20px 16px 48px}
    .app-wrap{max-width:640px;margin:auto}.app-wrap.wide{max-width:1100px}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px;font-family:"Jua";font-size:21px}
    .dots{flex:none;width:72px;height:14px;background:radial-gradient(circle at 7px 7px,var(--a) 0 7px,transparent 8px),radial-gradient(circle at 25px 7px,var(--b) 0 7px,transparent 8px),radial-gradient(circle at 43px 7px,var(--c) 0 7px,transparent 8px),radial-gradient(circle at 61px 7px,var(--d) 0 7px,transparent 8px)}
    .tabs{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
    .tabs button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--muted);white-space:nowrap}
    .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
    .modebar{margin-bottom:14px;padding:10px 12px;border:1px solid var(--warnLine);border-radius:10px;background:var(--warnBg);font-size:13px}

    .ticket,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 22px}
    .perf{border-top:2px dashed var(--line);margin:20px -22px}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
    .title{font-size:clamp(28px,7vw,39px);margin-top:6px}
    .lead,.hint,.status{color:var(--muted)}
    .lead{margin-top:10px;line-height:1.6}
    .hint{font-size:13px;line-height:1.5}
    .field{display:grid;gap:6px;margin-top:14px}
    .field label,.lab{font-size:14px;font-weight:700}
    .input{width:100%;min-height:46px;padding:10px 13px;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:var(--ink)}
    .input:focus{border-color:var(--brand);outline:0}
    textarea.input{min-height:84px;resize:vertical;line-height:1.5}

    .seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .seg2 button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700}
    .seg2 button[aria-pressed="true"]{border-color:var(--brand);background:var(--brandSoft);color:var(--brand)}
    .mini{display:flex;gap:4px}
    .mini button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px}
    .mini button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

    .btn{min-height:46px;padding:10px 17px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
    .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
    .btn.danger{background:transparent;border-color:#f0b8b8;color:var(--danger)}
    .btn.sm{min-height:36px;padding:5px 11px;font-size:14px;border-radius:10px}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .block{width:100%;margin-top:18px}
    .link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;font-size:inherit}
    .err{color:var(--a);min-height:20px;margin-top:8px;font-size:14px}
    .ok{color:var(--c)}
    .panel .err:empty{display:none}

    .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:16px}
    .names.small{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:4px}
    .name{min-height:52px;padding:8px 6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700;display:grid;place-items:center;line-height:1.2}
    .names.small .name{min-height:40px;font-size:14px;font-weight:500}
    .name:hover:not(:disabled){border-color:var(--brand)}
    .name[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
    .name:disabled{opacity:.5;cursor:not-allowed}
    .name small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
    .pickcount{margin-top:12px;font-weight:700;color:var(--brand)}

    .punches{display:flex;gap:6px;margin-bottom:18px}.punches span{height:8px;flex:1;border-radius:5px;background:var(--line)}.punches span.on{background:var(--brand)}
    .qno{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
    .question{font-size:clamp(22px,5.5vw,29px);margin-top:6px}
    .opts{display:grid;gap:10px;margin-top:20px}
    .opt{display:grid;grid-template-columns:32px 1fr;gap:12px;text-align:left;align-items:center;padding:13px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:56px}
    .opt:hover,.opt[aria-pressed="true"]{border-color:var(--brand)}
    .opt[aria-pressed="true"]{background:var(--brandSoft)}
    .opt b{display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--line);border-radius:50%;background:var(--surface);font-size:14px}
    .opt[aria-pressed="true"] b{background:var(--brand);border-color:var(--brand);color:#fff}
    .navrow,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .navrow{justify-content:space-between;margin-top:20px}
    .spaced{justify-content:space-between}

    .result{--type:var(--a)}.result[data-type="B"]{--type:var(--b)}.result[data-type="C"]{--type:var(--c)}.result[data-type="D"]{--type:var(--d)}
    .badge{display:grid;place-items:center;width:72px;height:72px;border:2px solid var(--type);border-radius:22px;color:var(--type);background:#fff}
    .badge strong{font-family:"Jua";font-size:36px}
    .rtype{font-size:clamp(32px,9vw,45px);color:var(--type);margin-top:3px}
    .rrole{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f6f8ff}
    .rrole p{margin-top:4px}

    /* 선생님 */
    .tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .desk{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
    .stack{display:grid;gap:20px}
    .panel{padding:18px;display:grid;gap:12px}
    .panel h2{font-size:21px}
    .panel .field{margin-top:0}
    .tally{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .tally div{padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12px}
    .tally b{display:block;font-family:"Jua";font-size:25px;font-weight:400}
    .tablewrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
    td{white-space:nowrap}td.wrap{white-space:normal;min-width:120px}
    th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);z-index:1}
    tbody tr{cursor:pointer}tbody tr:hover{background:#f6f8ff}
    .rowname{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
    .pill.done{background:var(--okBg);color:#0b6b5e}.pill.manual{background:var(--brandSoft);color:var(--brand)}
    .empty{text-align:center;padding:25px 10px;color:var(--muted)}
    .note{padding:10px 12px;border:1px solid var(--warnLine);border-radius:10px;background:var(--warnBg);font-size:14px;line-height:1.55}
    .note.ok{border-color:var(--okLine);background:var(--okBg)}
    .note ul{margin:4px 0 0;padding-left:18px}

    .gsec{display:grid;gap:10px}
    .gsec+.gsec{margin-top:8px;padding-top:14px;border-top:2px dashed var(--line)}
    .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
    .group{padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
    .group.warn{border-color:var(--warnLine);background:var(--warnBg)}
    .group.pool{border-style:dashed;background:var(--surface)}
    .ghead{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:30px}
    .ghead h4{color:var(--muted);font-size:16px}
    .here{border:2px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:700}
    .xs{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
    .chip{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;width:100%;padding:7px 9px;border:2px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
    .chip:hover{border-color:#a9b8d6}
    .chip.sel{border-color:var(--brand);background:var(--brandSoft);box-shadow:0 0 0 2px var(--brand) inset}
    .chip small{font-weight:700;font-size:12px}
    .chip small.tA{color:var(--a)}.chip small.tB{color:var(--b)}.chip small.tC{color:var(--c)}.chip small.tD{color:var(--d)}.chip small.t0{color:var(--muted);font-weight:500}
    .chip em{grid-column:1/-1;font-style:normal;font-size:11px;font-weight:700;color:var(--warn)}
    .chip.unmet{border-color:var(--warnLine)}
    .gwarn{font-size:12px;font-weight:700;color:var(--warn);line-height:1.45}

    dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);color:var(--ink);background:var(--surface)}
    dialog::backdrop{background:rgba(20,33,61,.45)}
    .dlg{padding:22px;display:grid;gap:12px}
    .dlg .field{margin-top:0}

    .big{position:fixed;inset:0;z-index:50;background:var(--surface);overflow:auto;padding:24px}
    .bigbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .bigbar h1{font-size:clamp(28px,4vw,40px)}
    .big h2{font-size:28px;margin:18px 0 10px}
    .biggroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
    .bigcard{border:2px solid var(--line);border-radius:16px;padding:14px 16px}
    .bigcard h3{font-size:24px;color:var(--brand);margin-bottom:8px}
    .bigcard li{font-size:22px;line-height:1.6;list-style:none;display:flex;justify-content:space-between;gap:10px}
    .bigcard li small{font-size:14px;color:var(--muted);align-self:center}
    .bigcard ul{margin:0;padding:0}

    @media(max-width:860px){.desk{grid-template-columns:1fr}}
    @media(max-width:520px){.bar{align-items:flex-start}.tabs button{padding:6px 10px}.ticket{padding:22px 18px}.perf{margin:20px -18px}}
    @media print{
      body *{visibility:hidden}
      #big,#big *{visibility:visible}
      #big{position:absolute;inset:0;padding:0;overflow:visible}
      .bigbar .row{display:none}
      .bigcard{break-inside:avoid}
      .bigcard li{font-size:16px}.bigcard h3{font-size:18px}.big h2{font-size:20px}
    }
  </style>
</head>
<body class="notranslate" translate="no">
  <div class="app-shell">
    <div id="shell" class="app-wrap">
      <header class="bar">
        <div class="brand"><span class="dots" aria-hidden="true"></span><span>탐험대 모둠 편성</span></div>
        <nav class="tabs" aria-label="화면 선택">
          <button type="button" id="tabStudent" aria-pressed="true">학생</button>
          <button type="button" id="tabTeacher" aria-pressed="false">선생님</button>
        </nav>
      </header>
      <p id="modebar" class="modebar" hidden>체험 모드예요. 아직 Supabase가 연결되지 않아서 <b>이 기기에만</b> 저장돼요. 학생들이 각자 기기로 하려면 README의 연결 방법을 따라 주세요.</p>
      <main id="studentView" aria-live="polite"></main>
      <main id="teacherView" hidden></main>
    </div>
  </div>
  <dialog id="editDlg" aria-labelledby="editTitle"></dialog>
  <div id="big" class="big" hidden></div>

  <script src="config.js"></script>
  <script>
  (() => {
    "use strict";

    /* ================= 테스트 내용 ================= */
    const TYPES = {
      A:{name:"스릴 대장",line:"무섭고 빠를수록 좋아! 도전 정신 만렙",body:"놀이공원에서 제일 먼저 달려가는 용감한 탐험가예요.",role:"첫 발을 내딛는 도전 담당이에요."},
      B:{name:"계획 박사",line:"지도와 시간표가 내 무기인 알뜰 탐험가",body:"동선과 대기 시간을 살피며 최고의 코스를 만드는 사람이에요.",role:"길 찾기와 시간 관리 담당이에요."},
      C:{name:"느긋 감성러",line:"분위기와 간식과 사진이 최고인 여유로운 산책가",body:"풍경과 기분을 소중히 여기며 즐거운 순간을 발견해요.",role:"속도 조절과 쉬어 가기 담당이에요."},
      D:{name:"분위기 메이커",line:"같이 있으면 더 신나는 모둠의 접착제",body:"누구와도 금방 어울리고 함께하는 시간을 더 즐겁게 만들어요.",role:"모둠의 말과 마음을 이어 주는 분위기 담당이에요."}
    };
    const QS = [
      ["놀이공원 입구에 도착했다! 제일 먼저 하는 일은?",["제일 무서워 보이는 놀이기구로 달려간다","안내 지도를 펴서 오늘 코스를 짠다","예쁜 풍경과 캐릭터 가게를 둘러본다","친구들과 뭐부터 할지 의논한다"]],
      ["인기 놀이기구 대기 시간이 90분이래!",["무서운 거면 기다릴 수 있다","사람 적은 시간에 다시 오자","간식 먹고 구경하면 금방이다","친구와 수다 떨면 순식간이다"]],
      ["줄 서는 동안 나는?",["두근두근 소리에 귀 기울인다","다음 계획을 생각한다","주변을 구경하거나 멍을 때린다","앞뒤 친구들과 이야기를 나눈다"]],
      ["롤러코스터 꼭대기에서 나는?",["두 손 들고 소리 지른다","안전바를 한 번 더 확인한다","눈 감고 바람을 느낀다","옆 사람 손을 잡고 같이 소리 지른다"]],
      ["점심시간에는?",["빨리 먹고 하나라도 더 타자","미리 알아 둔 식당에서 먹는다","예쁜 카페에서 천천히 먹는다","다 같이 나눠 먹는다"]],
      ["친구가 무서운 건 못 탄다고 하면?",["나만 타고 오겠다고 한다","모두 즐길 수 있는 기구를 찾는다","무리하지 말고 다른 걸 타자고 한다","용기를 낼 수 있게 응원한다"]],
      ["갑자기 비가 내리면?",["비 맞는 놀이기구가 더 신난다","실내 기구 위치부터 확인한다","우비 입고 사진을 찍는다","처마 밑에 모여 수다를 떤다"]],
      ["모둠 친구들과 의견이 갈리면?",["내가 가고 싶은 곳을 주장한다","공평하게 정할 방법을 찾는다","친구들을 따라간다","서로 듣고 중간 지점을 찾는다"]],
      ["꼭 사고 싶은 기념품은?",["스릴 인증 놀이기구 사진","방문 기록 노트나 스탬프","귀여운 머리띠나 인형","친구들과 맞춘 우정템"]],
      ["집에 오는 버스 안에서 나는?",["오늘 탄 것 중 최고를 꼽는다","오늘 몇 개 탔는지 센다","창밖을 보며 하루를 떠올린다","웃긴 일을 계속 이야기한다"]]
    ];
    const KEYS = ["A","B","C","D"], GENDERS = ["여","남"], MAX_WISH = 3, MAX_GROUP = 5;

    /* ================= 도구 ================= */
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]} return b; };
    const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
    const byName = (a,b) => a.name.localeCompare(b.name, "ko");
    const normName = s => String(s || "").replace(/\s+/g, "");
    const fmtTime = iso => { try { const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; } catch(e) { return ""; } };

    /* ================= 저장소 (Supabase 또는 체험 모드) ================= */
    const CFG = window.TAMHEOM_CONFIG || {};
    const REMOTE = !!(CFG.supabaseUrl && CFG.supabaseKey);
    const api = REMOTE ? remoteApi(CFG) : localApi();

    function remoteApi(cfg){
      const base = cfg.supabaseUrl.trim().replace(/\/+$/, ""), key = cfg.supabaseKey.trim();
      async function rpc(fn, args){
        const headers = {"Content-Type":"application/json", apikey:key};
        if (key.startsWith("eyJ")) headers.Authorization = "Bearer " + key;
        const res = await fetch(`${base}/rest/v1/rpc/${fn}`, {method:"POST", headers, body:JSON.stringify(args || {})});
        if (!res.ok) throw new Error(res.status + " " + await res.text());
        return res.json();
      }
      return {
        roster: () => rpc("tm_roster"),
        submitSelf: (name, gender, type, answers, wishNames) => rpc("tm_submit_self", {p_name:name, p_gender:gender, p_type:type, p_answers:answers, p_wish_names:wishNames}),
        load: pw => rpc("tm_load", {p_pw:pw}),
        saveStudent: (pw, data) => rpc("tm_save_student", {p_pw:pw, p_data:data}),
        addMany: (pw, rows) => rpc("tm_add_many", {p_pw:pw, p_rows:rows}),
        remove: (pw, id) => rpc("tm_delete_student", {p_pw:pw, p_id:id}),
        setSetting: (pw, key, value) => rpc("tm_set_setting", {p_pw:pw, p_key:key, p_value:value}),
        changePw: (pw, next) => rpc("tm_change_pw", {p_pw:pw, p_new:next})
      };
    }

    function localApi(){
      const KEY = "tamheom-local-v1";
      const fresh = () => ({students:[], settings:{}, pw:"1018"});
      const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { return null; } };
      let mem = read() || fresh();
      const sync = () => { mem = read() || mem; };
      const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} };
      const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2);
      const bad = pw => pw === mem.pw ? null : {ok:false, error:"bad"};
      const copy = x => JSON.parse(JSON.stringify(x));
      const sorted = () => [...mem.students].sort((a,b) => a.gender.localeCompare(b.gender) || byName(a,b));
      const dup = (name, gender, id) => mem.students.some(s => s.name === name && s.gender === gender && s.id !== id);
      const blank = (name, gender, type) => ({id:uid(), name, gender, type:type || null, answers:null, wishes:[], wish_names:[], submitted_at:null});
      return {
        async roster(){ sync(); return sorted().map(s => ({id:s.id, name:s.name, gender:s.gender, submitted:!!s.submitted_at})); },
        async submitSelf(name, gender, type, answers, wishNames){
          sync(); name = normName(name);
          if (!name || name.length > 20 || !GENDERS.includes(gender)) return {ok:false, error:"name"};
          let me = mem.students.find(s => s.name === name && s.gender === gender);
          if (me && me.submitted_at) return {ok:false, error:"already"};
          if (!me) { me = blank(name, gender); mem.students.push(me); }
          const wn = [...new Set((wishNames || []).map(normName).filter(x => x && x !== name && x.length <= 20))].slice(0, MAX_WISH);
          Object.assign(me, {type, answers, wish_names:wn, submitted_at:new Date().toISOString()}); save(); return {ok:true};
        },
        async load(pw){ sync(); return bad(pw) || {ok:true, students:copy(sorted()), settings:copy(mem.settings)}; },
        async saveStudent(pw, d){
          sync(); const e = bad(pw); if (e) return e;
          const name = (d.name || "").trim(); if (!name) return {ok:false, error:"name"};
          if (dup(name, d.gender, d.id)) return {ok:false, error:"dup"};
          if (!d.id) { const s = blank(name, d.gender, d.type); mem.students.push(s); save(); return {ok:true, id:s.id}; }
          const s = mem.students.find(x => x.id === d.id); if (!s) return {ok:false, error:"notfound"};
          if (d.reset) Object.assign(s, {name, gender:d.gender, type:null, answers:null, wishes:[], wish_names:[], submitted_at:null});
          else Object.assign(s, {name, gender:d.gender, type:d.type || null, wishes:[...new Set(d.wishes || [])].filter(x => x !== s.id), wish_names:[]});
          save(); return {ok:true, id:s.id};
        },
        async addMany(pw, rows){
          sync(); const e = bad(pw); if (e) return e; let n = 0;
          rows.forEach(r => { const name = (r.name || "").trim(); if (name && GENDERS.includes(r.gender) && !dup(name, r.gender)) { mem.students.push(blank(name, r.gender)); n++; } });
          save(); return {ok:true, added:n};
        },
        async remove(pw, id){
          sync(); const e = bad(pw); if (e) return e;
          mem.students = mem.students.filter(s => s.id !== id);
          mem.students.forEach(s => s.wishes = s.wishes.filter(x => x !== id)); save(); return {ok:true};
        },
        async setSetting(pw, key, value){ sync(); const e = bad(pw); if (e) return e; mem.settings[key] = value; save(); return {ok:true}; },
        async changePw(pw, next){ sync(); const e = bad(pw); if (e) return e; if (!next || next.length < 4) return {ok:false, error:"short"}; mem.pw = next; save(); return {ok:true}; }
      };
    }

    /* ================= 학생 화면 ================= */
    const S = {step:"start", name:"", gender:"", roster:[], q:0, answers:[], order:[], wishNames:["","",""], type:null, msg:""};

    async function loadRoster(){

    function computeType(answers){
      const count = {A:0,B:0,C:0,D:0}; answers.forEach(a => count[a]++);
      const max = Math.max(...Object.values(count)), tops = KEYS.filter(k => count[k] === max);
      return tops.includes(answers[answers.length-1]) ? answers[answers.length-1] : tops[0];
    }

    async function submitStudent(wishNames){
      S.type = computeType(S.answers); S.msg = ""; S.step = "saving"; renderStudent();
      try {
        const r = await api.submitSelf(S.name, S.gender, S.type, S.answers, wishNames);

        else if (r && r.error === "already") { S.step = "already"; }
        else if (r && r.error === "name") { S.step = "start"; S.msg = "이름을 다시 확인해 주세요."; }
        else { S.step = "friends"; S.msg = "저장하지 못했어요. 다시 눌러 주세요."; }
      } catch(e) { S.step = "friends"; S.msg = "인터넷 연결이 불안정해요. 잠시 뒤 다시 눌러 주세요."; }

    // 학생이 적은 친구 이름(wish_names)을 명단의 학생과 연결. 못 찾은 이름은 unmatched로 표시
    function prep(r){
      const list = r.students || [];
      list.forEach(s => {
        const names = s.wish_names || [], ids = new Set(s.wishes || []), unmatched = [];
        names.forEach(n => {
          const m = list.find(x => x.gender === s.gender && x.name === n && x.id !== s.id);
          if (m) ids.add(m.id); else unmatched.push(n);
        });
        s.wishes = [...ids]; s.unmatched = unmatched;
      });
      return r;
    }

    // 수정 창

    /* ---------- ② 모둠 짜기 ---------- */
    function suggestSizes(n){
      if (n <= 0) return "";
      if (n <= MAX_GROUP) return String(n);
      let best = null, bestScore = -Infinity;
      for (let c = 0; c * 5 <= n; c++) for (let a = 0; a * 4 + c * 5 <= n; a++) {
        const rest = n - a*4 - c*5; if (rest % 3) continue; const b = rest / 3;
        const score = a*10 - b*3 - c*4;
        if (score > bestScore) { bestScore = score; best = [...Array(a).fill(4), ...Array(c).fill(5), ...Array(b).fill(3)]; }
      }
      return best ? best.join(",") : String(n);
    }
    function parseSizes(str, n){
      const arr = String(str || "").split(/[^0-9]+/).filter(Boolean).map(Number);
      if (!n) return {ok:true, sizes:[], msg:"학생이 없어요."};
      if (!arr.length) return {ok:false, msg:"모둠별 인원을 적어 주세요. 예: 4,4,4,5"};
      if (arr.some(x => x < 1)) return {ok:false, msg:"0명인 모둠은 뺄게요. 숫자를 확인해 주세요."};
      if (arr.some(x => x > MAX_GROUP)) return {ok:false, msg:`한 모둠은 ${MAX_GROUP}명까지만 돼요.`};
      const sum = arr.reduce((a,b) => a+b, 0);
      if (sum !== n) return {ok:false, msg:`합계가 ${sum}명이에요. ${n}명이 되도록 맞춰 주세요. ('추천'을 누르면 자동으로 맞춰요)`};
      const odd = arr.filter(x => x % 2);
      return {ok:true, sizes:arr, msg:`✓ ${arr.length}모둠` + (odd.length ? ` · 홀수 모둠 ${odd.length}개(${odd.join(", ")}명)` : " · 모두 짝수")};
    }
    function parseCons(text){
      const list = students(), names = new Map();
      list.forEach(s => { if (!names.has(s.name)) names.set(s.name, []); names.get(s.name).push(s); });
      const sets = [], errors = [];
      String(text || "").split(/\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
        const parts = line.split(/[\s,·/]+/).filter(Boolean);
        const ids = [];
        parts.forEach(n => {
          const m = names.get(n);
          if (!m) errors.push(`'${n}'은(는) 명단에 없어요`);
          else if (m.length > 1) errors.push(`'${n}'은(는) 남녀 모두 있어서 구분이 안 돼요`);
          else ids.push(m[0].id);
        });
        if (parts.length < 2) errors.push(`"${line}" 줄에는 이름이 2명 이상 있어야 해요`);
        if (ids.length >= 2) sets.push(ids);
      });
      return {sets, errors};
    }
    function consPairs(){
      const c = setting("constraints", {together:"", apart:""});
      const map = sById(), tog = [], apt = [], cross = [];
      parseCons(c.together).sets.forEach(ids => { for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) {
        const a = map.get(ids[i]), b = map.get(ids[j]);
        if (a.gender !== b.gender) cross.push(`${a.name}·${b.name}`); else tog.push([ids[i], ids[j]]);
      }});
      parseCons(c.apart).sets.forEach(ids => { for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) apt.push([ids[i], ids[j]]); });
      return {tog, apt, cross};
    }

    // 모둠 짜기: 조건 위반을 가장 크게, 희망 친구 0명을 그다음으로, 같은 유형 몰림을 가장 작게 벌점 주고 자리를 바꿔 가며 최소화
    function solve(ids, sizes, tog, apt){
      const n = ids.length, k = sizes.length; if (!n) return [];
      const map = sById(), ix = new Map(ids.map((id,i) => [id,i]));
      const W = ids.map(id => (map.get(id).wishes || []).map(w => ix.get(w)).filter(v => v !== undefined));
      const TP = ids.map(id => { const t = map.get(id).type; return t ? KEYS.indexOf(t) : -1; });
      const pairs = arr => arr.map(([a,b]) => [ix.get(a), ix.get(b)]).filter(p => p[0] !== undefined && p[1] !== undefined);
      const TG = pairs(tog), AP = pairs(apt);
      const cnt = new Array(k*4);
      function cost(g){
        let c = 0;
        for (const [a,b] of TG) if (g[a] !== g[b]) c += 1000;
        for (const [a,b] of AP) if (g[a] === g[b]) c += 1000;
        for (let i=0;i<n;i++) { const w = W[i]; if (!w.length) continue; let m = 0; for (const j of w) if (g[j] === g[i]) m++; c += m ? -4*m : 300; }
        cnt.fill(0); for (let i=0;i<n;i++) if (TP[i] >= 0) cnt[g[i]*4 + TP[i]]++;
        for (const x of cnt) c += 5 * x * (x-1);
        return c;
      }
      let best = null, bestC = Infinity;
      const RESTARTS = 40, STEPS = 4000;
      for (let r = 0; r < RESTARTS; r++) {
        const perm = shuffle([...Array(n).keys()]), g = new Array(n); let p = 0;
        sizes.forEach((sz, gi) => { for (let t = 0; t < sz; t++) g[perm[p++]] = gi; });
        let cur = cost(g);
        if (cur < bestC) { bestC = cur; best = [...g]; }
        for (let s = 0; s < STEPS; s++) {
          const a = Math.floor(Math.random()*n), b = Math.floor(Math.random()*n);
          if (g[a] === g[b]) continue;
          [g[a], g[b]] = [g[b], g[a]];
          const next = cost(g), d = next - cur, temp = Math.max(0.3, 60 * (1 - s/STEPS));
          if (d <= 0 || Math.random() < Math.exp(-d/temp)) { cur = next; if (cur < bestC) { bestC = cur; best = [...g]; } }
          else [g[a], g[b]] = [g[b], g[a]];
        }
      }
      const out = sizes.map(() => []); best.forEach((gi, i) => out[gi].push(ids[i]));
      return out.map(arr => arr.sort((x,y) => byName(map.get(x), map.get(y))));
    }

    function cleanGroups(raw){
      if (!raw || typeof raw !== "object") return null;
      const out = {at:raw.at || Date.now()};
      GENDERS.forEach(g => { out[g] = Array.isArray(raw[g]) ? raw[g].map(a => Array.isArray(a) ? a.slice() : []) : []; });
      return out;
    }
    function groupView(){
      // 현재 명단 기준으로 정리: 지워진 학생 빼기, 성별 바뀐 학생 빼기, 모둠 없는 학생 따로
      const map = sById(), view = {};
      GENDERS.forEach(g => {
        const groups = (T.groups && T.groups[g] || []).map(a => a.filter(id => map.get(id) && map.get(id).gender === g));
        const seen = new Set(); groups.forEach(a => a.forEach(id => seen.add(id)));
        const pool = students().filter(s => s.gender === g && !seen.has(s.id)).map(s => s.id);
        view[g] = {groups, pool};
      });
      if (T.groups) GENDERS.forEach(g => T.groups[g] = view[g].groups);
      return view;
    }
    function evaluate(view){
      const map = sById(), {tog, apt} = consPairs(), res = {};
      GENDERS.forEach(g => {
        const {groups} = view[g], where = new Map();
        groups.forEach((a,i) => a.forEach(id => where.set(id, i)));
        const unmet = new Set(), gw = groups.map(() => []);
        groups.forEach(a => a.forEach(id => {
          const w = (map.get(id).wishes || []).filter(x => map.has(x));
          if (w.length && !w.some(x => where.get(x) === where.get(id))) unmet.add(id);
        }));
        groups.forEach((a,i) => { if (a.length > MAX_GROUP) gw[i].push(`${a.length}명이에요 (최대 ${MAX_GROUP}명)`); });
        apt.forEach(([a,b]) => { if (map.get(a).gender === g && where.has(a) && where.get(a) === where.get(b)) gw[where.get(a)].push(`${map.get(a).name}·${map.get(b).name} 떨어져야 해요`); });
        tog.forEach(([a,b]) => { if (map.get(a).gender === g && where.get(a) !== where.get(b)) { const i = where.has(a) ? where.get(a) : where.get(b); if (i !== undefined) gw[i].push(`${map.get(a).name}·${map.get(b).name} 같은 모둠이어야 해요`); } });
        res[g] = {unmet, gw};
      });
      return res;
    }

    const saveGroups = debounce(async () => {
      setSaveState("저장 중…");
      const r = await call(api.setSetting(T.pw, "groups", T.groups)); if (!r) return;
      setSaveState(r.ok ? "모둠 저장됨 ✓" : "저장 실패 · 인터넷을 확인해 주세요");

    const saveSetting = debounce(async (key, value) => {

      setSaveState(r.ok ? "저장됨 ✓" : "저장 실패 · 인터넷을 확인해 주세요");
    }, 600);

    function renderGroupsTab(){
      const all = students(), sizesSet = setting("sizes", {}), cons = setting("constraints", {together:"", apart:""});
      const count = g => all.filter(s => s.gender === g).length;
      const sizeVal = g => sizesSet[g] != null && sizesSet[g] !== "" ? sizesSet[g] : suggestSizes(count(g));
      const missing = all.filter(s => !s.type).length;
      $("tbody").innerHTML = `<div class="desk">
        <div class="stack">
          <section class="panel">
            <h2>모둠 인원</h2>
            ${GENDERS.map(g => `<div class="field"><label for="size-${g}">${g}학생 ${count(g)}명 → 모둠별 인원</label>
              <div class="row"><input id="size-${g}" class="input" style="flex:1" data-size="${g}" value="${esc(sizeVal(g))}" inputmode="numeric" autocomplete="off"><button class="btn ghost sm" type="button" data-auto="${g}">추천</button></div>
              <p class="hint" id="sizeMsg-${g}"></p></div>`).join("")}
            <p class="hint">쉼표로 나눠 적어요. 한 모둠은 최대 ${MAX_GROUP}명. 추천은 4명 모둠을 최대한 많이 만들어요.</p>
          </section>
          <section class="panel">
            <h2>친구 조건</h2>
            <div class="field"><label for="togBox">꼭 같은 모둠</label>
              <textarea id="togBox" class="input" placeholder="한 줄에 같은 모둠이 되어야 할 학생들&#10;예: 김하늘 이솔">${esc(cons.together)}</textarea><p class="hint" id="togMsg"></p></div>
            <div class="field"><label for="aptBox">꼭 다른 모둠</label>
              <textarea id="aptBox" class="input" placeholder="한 줄에 서로 떨어져야 할 학생들&#10;예: 박준 최민 (세 명 이상도 가능)">${esc(cons.apart)}</textarea><p class="hint" id="aptMsg"></p></div>
          </section>
          <section class="panel">
            <button class="btn primary" type="button" id="makeBtn">${T.groups ? "모둠 새로 짜기" : "모둠 짜기"}</button>
            <p class="hint" id="makeHint">${missing ? `아직 유형이 없는 학생 ${missing}명도 함께 편성돼요.` : ""}</p>
          </section>
        </div>
        <div class="stack"><section class="panel" id="outPanel"></section></div>
      </div>`;

      const checkSizes = () => GENDERS.map(g => { const r = parseSizes($("size-"+g).value, count(g)); const el = $("sizeMsg-"+g); el.textContent = r.msg; el.style.color = r.ok ? "var(--c)" : "var(--a)"; return r; });
      const checkCons = () => {
        [["togBox","togMsg"],["aptBox","aptMsg"]].forEach(([box,msg]) => {
          const {sets, errors} = parseCons($(box).value), el = $(msg);
          if (errors.length) { el.textContent = "⚠ " + errors.join(" · "); el.style.color = "var(--a)"; }
          else { el.textContent = sets.length ? `✓ ${sets.length}줄 적용돼요` : ""; el.style.color = "var(--c)"; }
        });
        const {cross} = consPairs();
        if (cross.length) { $("togMsg").textContent += ` ⚠ 남녀는 같은 모둠이 될 수 없어요: ${cross.join(", ")}`; $("togMsg").style.color = "var(--a)"; }
      };
      const storeSizes = () => { const v = {}; GENDERS.forEach(g => v[g] = $("size-"+g).value.trim()); T.data.settings.sizes = v; saveSetting("sizes", v); };
      const storeCons = () => { const v = {together:$("togBox").value, apart:$("aptBox").value}; T.data.settings.constraints = v; saveSetting("constraints", v); };
      checkSizes(); checkCons();
      $("tbody").querySelectorAll("[data-size]").forEach(el => el.oninput = () => { checkSizes(); storeSizes(); });
      $("tbody").querySelectorAll("[data-auto]").forEach(b => b.onclick = () => { $("size-"+b.dataset.auto).value = suggestSizes(count(b.dataset.auto)); checkSizes(); storeSizes(); });
      $("togBox").oninput = () => { storeCons(); checkCons(); renderOut(); };
      $("aptBox").oninput = () => { storeCons(); checkCons(); renderOut(); };
      $("makeBtn").onclick = () => {
        const sz = checkSizes();
        if (!all.length) return $("makeHint").textContent = "먼저 ① 학생 명단에 학생을 넣어 주세요.";
        if (sz.some(r => !r.ok)) return $("makeHint").textContent = "모둠 인원 합계를 먼저 맞춰 주세요.";
        if (T.groups && !confirm("지금 모둠을 지우고 새로 짤까요? 직접 옮긴 내용도 사라져요.")) return;
        const {tog, apt} = consPairs(), next = {at:Date.now()};
        GENDERS.forEach((g, gi) => { next[g] = solve(all.filter(s => s.gender === g).map(s => s.id), sz[gi].sizes, tog, apt); });
        T.groups = next; T.sel = null; saveGroups();
        $("makeBtn").textContent = "모둠 새로 짜기"; $("makeHint").textContent = "";
        renderOut();
      };
      renderOut();
    }

    function renderOut(){
      const out = $("outPanel"); if (!out) return;
      if (!T.groups) { out.innerHTML = `<h2>모둠 결과</h2><div class="empty">왼쪽에서 인원과 조건을 확인하고 '모둠 짜기'를 눌러 주세요.</div>`; return; }
      const map = sById(), view = groupView(), ev = evaluate(view), {cross} = consPairs();
      const unmetAll = GENDERS.flatMap(g => [...ev[g].unmet]).map(id => map.get(id).name);
      const warnAll = GENDERS.flatMap(g => ev[g].gw.flat());
      const poolAll = GENDERS.flatMap(g => view[g].pool);
      const sel = T.sel && map.get(T.sel);
      const issues = [];
      if (unmetAll.length) issues.push(`희망 친구와 다른 모둠이 된 학생 ${unmetAll.length}명: ${esc(unmetAll.join(", "))} — 희망이 서로 엇갈리거나 '꼭 다른 모둠' 조건과 겹쳐서 모두 맞출 수 없을 때 생겨요. 직접 옮겨서 조정할 수 있어요.`);
      warnAll.forEach(w => issues.push(esc(w)));
      if (poolAll.length) issues.push(`아직 모둠이 없는 학생 ${poolAll.length}명 (아래에서 모둠으로 옮겨 주세요)`);
      if (cross.length) issues.push(`남녀가 섞인 '꼭 같은 모둠' 조건은 적용하지 않았어요: ${esc(cross.join(", "))}`);

      out.innerHTML = `<div class="row spaced"><h2>모둠 결과</h2>
          <div class="row"><button class="btn ghost sm" type="button" id="bigBtn">크게 보기</button><button class="btn ghost sm" type="button" id="printBtn">인쇄</button><button class="btn sm" type="button" id="copyBtn">텍스트 복사</button></div></div>
        ${issues.length ? `<div class="note"><b>확인할 것</b><ul>${issues.map(x => `<li>${x}</li>`).join("")}</ul></div>`
          : `<div class="note ok">희망 친구를 고른 학생은 모두 그중 1명 이상과 같은 모둠이에요. 친구 조건도 모두 지켜졌어요.</div>`}
        <p class="hint">${sel ? `<b>${esc(sel.name)}</b> 선택됨 → 바꿀 학생을 누르거나 모둠의 '여기로'를 누르세요. (다시 누르면 취소)` : "학생 이름을 누르고 다른 학생을 누르면 서로 자리를 바꿔요. '여기로'를 누르면 그 모둠으로 옮겨요. 바꿀 때마다 자동 저장돼요."}</p>
        ${GENDERS.filter(g => view[g].groups.length || view[g].pool.length).map(g => `<section class="gsec">
          <div class="row spaced"><h3>${g}학생</h3><button class="btn ghost sm" type="button" data-addg="${g}">+ 모둠 추가</button></div>
          <div class="groups">
            ${view[g].groups.map((arr, i) => {
              const canHere = sel && sel.gender === g && !arr.includes(sel.id);
              return `<div class="group ${ev[g].gw[i].length ? "warn" : ""}">
                <div class="ghead"><h4>${g} ${i+1}모둠 · ${arr.length}명</h4>
                  ${canHere ? `<button class="here" type="button" data-here="${g}|${i}">여기로</button>` : !arr.length ? `<button class="xs" type="button" data-delg="${g}|${i}">모둠 삭제</button>` : ""}</div>
                ${arr.map(id => chip(map.get(id), ev[g].unmet.has(id))).join("")}
                ${ev[g].gw[i].map(w => `<p class="gwarn">⚠ ${esc(w)}</p>`).join("")}
              </div>`;
            }).join("")}
            ${view[g].pool.length || (sel && sel.gender === g && !view[g].pool.includes(sel.id)) ? `<div class="group pool">
              <div class="ghead"><h4>모둠 없음 · ${view[g].pool.length}명</h4>${sel && sel.gender === g && !view[g].pool.includes(sel.id) ? `<button class="here" type="button" data-here="${g}|pool">빼기</button>` : ""}</div>
              ${view[g].pool.map(id => chip(map.get(id), false)).join("")}
            </div>` : ""}
          </div>
        </section>`).join("")}`;

      out.querySelectorAll(".chip").forEach(b => b.onclick = () => onChip(b.dataset.id));
      out.querySelectorAll("[data-here]").forEach(b => b.onclick = () => { const [g, i] = b.dataset.here.split("|"); moveTo(g, i === "pool" ? null : +i); });
      out.querySelectorAll("[data-addg]").forEach(b => b.onclick = () => { T.groups[b.dataset.addg].push([]); saveGroups(); renderOut(); });
      out.querySelectorAll("[data-delg]").forEach(b => b.onclick = () => { const [g, i] = b.dataset.delg.split("|"); T.groups[g].splice(+i, 1); saveGroups(); renderOut(); });
      $("copyBtn").onclick = copyText;
      $("bigBtn").onclick = () => openBig(false);
      $("printBtn").onclick = () => openBig(true);
    }
    function chip(s, unmet){
      const cls = s.type ? "t" + s.type : "t0";
      return `<button class="chip ${T.sel === s.id ? "sel" : ""} ${unmet ? "unmet" : ""}" type="button" data-id="${esc(s.id)}" aria-pressed="${T.sel === s.id}">
        <span>${esc(s.name)}</span><small class="${cls}">${s.type ? TYPES[s.type].name : "미제출"}</small>${unmet ? "<em>희망 친구와 떨어짐</em>" : ""}</button>`;
    }
    function locate(id){
      const s = sById().get(id); if (!s) return null;
      const groups = T.groups[s.gender] || [];
      for (let i = 0; i < groups.length; i++) { const j = groups[i].indexOf(id); if (j >= 0) return {g:s.gender, i, j}; }
      return {g:s.gender, i:null, j:null};
    }
    function onChip(id){
      if (!T.sel || T.sel === id) { T.sel = T.sel === id ? null : id; return renderOut(); }
      const a = locate(T.sel), b = locate(id);
      if (!a || !b || a.g !== b.g || a.i === b.i) { T.sel = id; return renderOut(); }
      const G = T.groups[a.g];
      if (a.i === null) { G[b.i][b.j] = T.sel; }            // 모둠 없는 학생 ↔ 모둠 학생
      else if (b.i === null) { G[a.i][a.j] = id; }
      else { G[a.i][a.j] = id; G[b.i][b.j] = T.sel; }
      T.sel = null; saveGroups(); renderOut();
    }
    function moveTo(g, i){
      const a = locate(T.sel); if (!a || a.g !== g) return;
      const G = T.groups[g];
      if (a.i !== null) G[a.i].splice(a.j, 1);
      if (i !== null) G[i].push(T.sel);
      T.sel = null; saveGroups(); renderOut();
    }
    function copyText(){
      const map = sById(), view = groupView();
      const lines = [];
      GENDERS.forEach(g => {
        view[g].groups.forEach((a, i) => lines.push(`${g} ${i+1}모둠: ${a.map(id => { const s = map.get(id); return s.name + (s.type ? `(${TYPES[s.type].name})` : ""); }).join(", ")}`));
        if (view[g].pool.length) lines.push(`${g} 모둠 없음: ${view[g].pool.map(id => map.get(id).name).join(", ")}`);
      });
      const text = lines.join("\n");
      const done = () => { $("copyBtn").textContent = "복사했어요 ✓"; setTimeout(() => $("copyBtn") && ($("copyBtn").textContent = "텍스트 복사"), 1500); };
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done).catch(() => { window.prompt("아래 내용을 복사해 주세요", text); });
    }
    function openBig(print){
      const map = sById(), view = groupView(), big = $("big");
      big.innerHTML = `<div class="bigbar"><h1>현장체험학습 모둠</h1><div class="row"><button class="btn ghost" type="button" id="bigPrint">인쇄</button><button class="btn" type="button" id="bigClose">닫기</button></div></div>
        ${GENDERS.filter(g => view[g].groups.length).map(g => `<h2>${g}학생</h2><div class="biggroups">${view[g].groups.map((a, i) => `<div class="bigcard"><h3>${i+1}모둠</h3><ul>${a.map(id => { const s = map.get(id); return `<li><span>${esc(s.name)}</span><small>${s.type ? TYPES[s.type].name : ""}</small></li>`; }).join("")}</ul></div>`).join("")}</div>`).join("")}`;
      big.hidden = false;
      $("bigClose").onclick = () => { big.hidden = true; };
      $("bigPrint").onclick = () => window.print();
      if (print) setTimeout(() => window.print(), 100);
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("big").hidden) $("big").hidden = true; });

    /* ================= 화면 전환 ================= */
    function show(teacher){
      $("studentView").hidden = teacher; $("teacherView").hidden = !teacher;
      $("tabStudent").setAttribute("aria-pressed", String(!teacher)); $("tabTeacher").setAttribute("aria-pressed", String(teacher));
      if (teacher) {
        if (T.pw && !T.data) { $("teacherView").innerHTML = `<p class="empty">불러오는 중…</p>`; reload().then(ok => { if (ok) T.groups = cleanGroups(setting("groups", null)); renderTeacher(); }); }
        else if (T.data) { renderTeacher(); reload().then(ok => { if (ok) renderTeacher(); }); }
        else renderTeacher();
      } else {
        $("shell").classList.remove("wide");
        loadRoster();
      }
    }
    $("tabStudent").onclick = () => show(false);
    $("tabTeacher").onclick = () => show(true);
    setInterval(async () => {
      if ($("teacherView").hidden || !T.data || T.tab !== "roster" || $("editDlg").open) return;
      const active = document.activeElement;
      if (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return;
      if (await reload()) renderRoster();
    }, 15000);

    $("modebar").hidden = REMOTE;
    S.order = QS.map(() => shuffle(KEYS));
    renderStudent(); loadRoster();
  })();
  </script>
</body>
</html>
